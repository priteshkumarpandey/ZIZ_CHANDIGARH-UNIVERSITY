[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "glucotwin"
version = "0.1.0"
description = "India-aware Digital Twin for proactive Type 2 Diabetes management"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "GlucoTwin Core Team" }
]
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "polars>=0.20.15",
    "pandas>=2.2.1",
    "numpy>=1.26.4",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.1.post1",
    "lightgbm>=4.3.0",
    "xgboost>=2.0.3",
    "torch>=2.2.1",
    "shap>=0.45.0",
    "pandera>=0.18.0",
    "prometheus-client>=0.20.0",
    "websockets>=12.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "jinja2>=3.1.3",
    "alembic>=1.13.1",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "greenlet>=3.0.0",
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.28",
    "aiokafka>=0.10.0",
    "typer>=0.9.0",
]

[project.scripts]
glucotwin = "src.glucotwin.cli:app"

[project.optional-dependencies]
train = [
    "optuna>=3.5.0",
    "mlflow>=2.11.1",
    "dvc>=3.48.0",
    "pymupdf>=1.28.2",
]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.3",
    "mypy>=1.9.0",
    "pre-commit>=3.6.2",
    "types-requests>=2.31.0",
    "types-psycopg2>=2.9.21",
    "types-PyYAML>=6.0.12",
    "optuna>=3.5.0",
    "mlflow>=2.11.1",
    "dvc>=3.48.0",
    "pymupdf>=1.28.2",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
markers = [
    "requires_data: marks tests that require local raw datasets"
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning"
]

[tool.mypy]
python_version = "3.11"
mypy_path = "."
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = true

