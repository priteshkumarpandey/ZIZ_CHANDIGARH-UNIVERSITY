apiVersion: apps/v1
kind: Deployment
metadata:
  name: glucotwin-api
  namespace: default
  labels:
    app: glucotwin-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: glucotwin-api
  template:
    metadata:
      labels:
        app: glucotwin-api
    spec:
      containers:
        - name: api
          image: glucotwin-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: glucotwin-config
          env:
            - name: DATABASE_URL
              value: "postgresql+asyncpg://glucouser:glucopass@postgres-service:5432/glucotwin"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: default
spec:
  selector:
    app: glucotwin-api
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP
