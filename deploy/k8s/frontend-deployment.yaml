apiVersion: apps/v1
kind: Deployment
metadata:
  name: glucotwin-frontend
  namespace: default
  labels:
    app: glucotwin-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: glucotwin-frontend
  template:
    metadata:
      labels:
        app: glucotwin-frontend
    spec:
      containers:
        - name: frontend
          image: glucotwin-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: glucotwin-config
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: default
spec:
  selector:
    app: glucotwin-frontend
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
  type: LoadBalancer
