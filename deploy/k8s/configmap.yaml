apiVersion: v1
kind: ConfigMap
metadata:
  name: glucotwin-config
  namespace: default
data:
  PROJECT_NAME: "GlucoTwin"
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  NEXT_PUBLIC_API_URL: "http://api-service:8000"
  NEXT_PUBLIC_WS_URL: "ws://api-service:8000/api/v1/stream"
