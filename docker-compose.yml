networks:
  glucotwin-network:
    driver: bridge

volumes:
  pgdata:
  kafka_data:
  mlflow_data:
  grafana_data:

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: glucotwin-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-glucouser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-glucopass}
      POSTGRES_DB: ${POSTGRES_DB:-glucotwin}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-glucouser} -d ${POSTGRES_DB:-glucotwin}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      glucotwin-network:
        aliases:
          - postgres
          - timescaledb

  kafka:
    image: apache/kafka:3.7.0
    container_name: glucotwin-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 0"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - glucotwin-network

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.11.1
    container_name: glucotwin-mlflow
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    command: mlflow server --backend-store-uri sqlite:////mlflow/mlflow.db --default-artifact-root /mlflow/artifacts --host 0.0.0.0 --port 5000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/')"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - glucotwin-network

  migrate:
    image: glucotwin-backend
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.backend
    container_name: glucotwin-migrate
    restart: "no"
    command: ["alembic", "-c", "src/glucotwin/db/alembic/alembic.ini", "upgrade", "head"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://glucouser:glucopass@timescaledb:5432/glucotwin}
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - glucotwin-network

  api:
    image: glucotwin-backend
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.backend
    container_name: glucotwin-api
    restart: unless-stopped
    command: ["uvicorn", "src.glucotwin.serving.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      PROJECT_NAME: ${PROJECT_NAME:-GlucoTwin}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DEMO_MODE: ${DEMO_MODE:-true}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://glucouser:glucopass@timescaledb:5432/glucotwin}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000"]}
    volumes:
      - ./models/checkpoints:/app/models/checkpoints:ro
    depends_on:
      timescaledb:
        condition: service_healthy
      kafka:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - glucotwin-network


  replay:
    image: glucotwin-backend
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.backend
    container_name: glucotwin-replay
    restart: unless-stopped
    command: ["python", "-m", "src.glucotwin.streaming.replay"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      REPLAY_SPEED: ${REPLAY_SPEED:-60.0}
      REPLAY_PATIENT_ID: ${REPLAY_PATIENT_ID:-DEMO_PAT_001}
      DEMO_MODE: ${DEMO_MODE:-true}

    depends_on:
      kafka:
        condition: service_started
      api:
        condition: service_healthy
    networks:
      - glucotwin-network

  frontend:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.frontend
    container_name: glucotwin-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/api/v1/stream}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "const req = require('http').get('http://127.0.0.1:3000', (res) => process.exit(res.statusCode === 200 ? 0 : 1)); req.on('error', () => process.exit(1)); req.setTimeout(3000, () => { req.destroy(); process.exit(1); });"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - glucotwin-network

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: glucotwin-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - glucotwin-network

  grafana:
    image: grafana/grafana:10.4.0
    container_name: glucotwin-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - glucotwin-network
