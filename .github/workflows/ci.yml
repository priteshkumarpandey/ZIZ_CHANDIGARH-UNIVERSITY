name: GlucoTwin CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Print Node Version
        run: |
          echo "System Node version: $(node --version 2>/dev/null || echo 'Not installed')"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Run Ruff Linter
        run: ruff check src/ tests/

      - name: Run Ruff Formatter Check
        run: ruff format --check src/ tests/

      - name: Run Mypy Type Checker
        run: mypy src/

  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Print Node Version
        run: |
          echo "System Node version: $(node --version 2>/dev/null || echo 'Not installed')"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Generate Synthetic Demo Data
        run: python scripts/make_demo_data.py

      - name: Run Pytest Suite
        run: pytest tests/ -v --cov=src/glucotwin --cov-report=xml

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Print Node and npm Version
        run: |
          echo "Active Node version: $(node --version)"
          echo "Active npm version: $(npm --version)"

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Style Linter
        run: |
          cd frontend
          npm run lint:style

      - name: Run TypeScript Check
        run: |
          cd frontend
          npm run type-check

      - name: Run ESLint
        run: |
          cd frontend
          npm run lint

      - name: Run Frontend Tests
        run: |
          cd frontend
          npm test

      - name: Build Next.js Application
        run: |
          cd frontend
          npm run build

  build-docker-images:
    runs-on: ubuntu-latest
    steps:
      - name: Free Runner Disk Space
        run: |
          echo "=== Disk space before cleanup ==="
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "$AGENT_TOOLSDIRECTORY/CodeQL"
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          docker system prune -af || true
          echo "=== Disk space after cleanup ==="
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Print Node Version
        run: |
          echo "System Node version: $(node --version 2>/dev/null || echo 'Not installed')"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Compose Images
        run: |
          docker compose build
